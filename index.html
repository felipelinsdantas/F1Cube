<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0d10;overflow:hidden;font-family:"Courier New",monospace}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));image-rendering:pixelated;display:block;touch-action:none;box-shadow:0 0 0 4px #000}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 14px;justify-content:space-between;pointer-events:none}
@media (pointer:coarse){#touch{display:flex}}
.pad{display:flex;gap:10px;pointer-events:auto}
.pad button{width:64px;height:64px;font:bold 26px monospace;color:#fff;background:#7d7d7d;border:4px solid;border-color:#c6c6c6 #373737 #373737 #c6c6c6;opacity:.75;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
.pad button.on{background:#5b8c2a;opacity:1}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="pad"><button data-k="l">&lt;</button><button data-k="r">&gt;</button></div>
  <div class="pad"><button data-k="b">v</button><button data-k="g">^</button></div>
</div>
<script>
(()=>{
'use strict';
const W=320,H=180,HZ=H/2;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');

// ---------- utilidades
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const mod=(a,n)=>((a%n)+n)%n;
const overlap=(x1,w1,x2,w2,p)=>{const h=(p||1)/2;return !((x1+w1*h)<(x2-w2*h)||(x1-w1*h)>(x2+w2*h));};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=rng(1337);

// ---------- configuração
const STEP=1/60,segLen=200,roadW=1200,rumbleLen=3,lanes=4,camH=1300,fov=100,drawDist=110;
const camDepth=1/Math.tan(fov/2*Math.PI/180);
const playerZ=camH*camDepth;
const maxSpeed=segLen/STEP;
const accel=maxSpeed/5,brk=-maxSpeed,decel=-maxSpeed/5,offDecel=-maxSpeed/2,offLimit=maxSpeed/4;
const centrifugal=0.3,CS=0.6,LAPS=3,WPU=14,fogDensity=3;
const PS=WPU/camH*W/2; // escala do carro do jogador
let FOG='#a6c9ff',GROUND='#89b7ae';
const BIOMES=[
 {g:['#5d9b34','#4f8a2a'],sky:['#5f95f0','#6ea1f7','#7dadfb','#8fbaff','#a6c9ff'],ground:'#89b7ae',far:'#86a1cf',farTop:'#9cb4dc',peak:'#f4f7ff',near:'#3f7d34',nearTop:'#58a044',sun:'#fff6b8',sunB:'#ffe066',cloudA:'#ffffff',cloudB:'#e3ecff'},
 {g:['#dccb7e','#d2c074'],sky:['#79b0f2','#8cc0f7','#a2cdf9','#bcd9f8','#e6dcb8'],ground:'#cdbd8a',far:'#d2b878',farTop:'#e3cf94',peak:'#efe0b0',near:'#c9a45a',nearTop:'#dcbb70',sun:'#fffbd0',sunB:'#ffd84a',cloudA:'#fbf3da',cloudB:'#e8dcb4'},
 {g:['#f1f6fb','#e2eaf2'],sky:['#9db8d9','#adc6e2','#bdd2e9','#cfdff0','#e4edf6'],ground:'#d8e4ee',far:'#9fb4cf',farTop:'#c9d8ea',peak:'#ffffff',near:'#b9ccdc',nearTop:'#eef4fa',sun:'#f4f8ff',sunB:'#cfe0f5',cloudA:'#ffffff',cloudB:'#dfe9f4'},
 {g:['#7a2a2a','#6b2222'],sky:['#2a0808','#3b0d0d','#4f1210','#6a1a12','#8a2a16'],ground:'#5a1a16',far:'#4a1414',farTop:'#6a2018',peak:'#8a2a1a',near:'#3a0f0f',nearTop:'#5e1a14',sun:'#d4503a',sunB:'#8a2a1a',cloudA:'#5a2a24',cloudB:'#3b1612'},
 {g:['#756a80','#6b6076'],sky:['#b9a6e8','#c5b4ee','#d1c3f2','#ddd1f6','#ece4fa'],ground:'#8a7f9b',far:'#9a86c4',farTop:'#b4a2da',peak:'#f0e6ff',near:'#6f6377',nearTop:'#8a7b92',sun:'#fff6f6',sunB:'#ffc0e0',cloudA:'#f4ecff',cloudB:'#d8c8f0'}

const BNAMES=['PLANÍCIE','DESERTO','TUNDRA NEVADA','NETHER','ILHA DE COGUMELOS'];

const ARCH=[null,{p:'#c9b46e',a:'#e3d397',b:'#b89c52'},{p:'#9ccbe0',a:'#e8f6fc',b:'#7fb6d2'},{p:'#1a0f2e',a:'#8a2be2',b:'#2a1544'},{p:'#efe6d0',a:'#c8262e',b:'#f5f5f5'}];
const TEAMS=[
 {n:'VERMELHO',c:'#d8232a',d:'#8f1519'},
 {n:'AZUL',c:'#2457d6',d:'#173a91'},
 {n:'VERDE',c:'#2fa84a',d:'#1c6e2f'},
 {n:'LARANJA',c:'#ee7f1a',d:'#a85410'},
 {n:'ROXO',c:'#8e44d6',d:'#5e2b91'},

 {n:'PRETO',c:'#2a2a2e',d:'#111114'}
];

// ---------- pista
const segs=[];
const easeIn=(a,b,p)=>a+(b-a)*p*p;
const easeInOut=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
const lastY=()=>segs.length?segs[segs.length-1].p2.world.y:0;
function addSeg(curve,y){
  const n=segs.length,dark=Math.floor(n/rumbleLen)%2;
  const c=dark?{grass:'#4f8a2a',road:'#4a4a52',rumble:'#e8e8e8',lane:null}
              :{grass:'#5d9b34',road:'#53535b',rumble:'#c8322a',lane:'#dcdcdc'};
  if(n===0){c.road='#f2f2f2';c.lane=null;}
  if(n===1){c.road='#141414';c.lane=null;}
  segs.push({index:n,p1:{world:{y:lastY(),z:n*segLen},camera:{},screen:{}},p2:{world:{y:y,z:(n+1)*segLen},camera:{},screen:{}},curve:curve*CS,sprites:[],cars:[],obs:[],c:c,gantry:n===3});
}
function addRoad(enter,hold,leave,curve,y){
  const sy=lastY(),ey=sy+y*segLen,total=enter+hold+leave;
  for(let i=0;i<enter;i++)addSeg(easeIn(0,curve,i/enter),easeInOut(sy,ey,i/total));
  for(let i=0;i<hold;i++)addSeg(curve,easeInOut(sy,ey,(enter+i)/total));
  for(let i=0;i<leave;i++)addSeg(easeInOut(curve,0,i/leave),easeInOut(sy,ey,(enter+hold+i)/total));
}
addRoad(20,30,20,0,0);
addRoad(25,35,25,3,0);
addRoad(20,25,20,0,22);
addRoad(25,30,25,-4,-10);
addRoad(15,25,15,0,-18);
addRoad(20,40,20,5,0);
addRoad(15,30,15,-3,14);
addRoad(20,20,20,6,8);
addRoad(25,25,25,0,-12);
addRoad(20,35,20,-5,6);
addRoad(25,40,25,0,0);
addRoad(15,25,15,4,16);
addRoad(15,25,15,-4,-16);
addRoad(30,50,30,0,0);
addRoad(20,40,20,-4,-12);
addRoad(20,40,20,6,0);
addRoad(25,60,25,0,0);
addRoad(25,40,25,0,-lastY()/segLen);
const N=segs.length,trackLen=N*segLen;
const segAt=z=>segs[Math.floor(mod(z,trackLen)/segLen)];
let fixedBiome=-1;
function biomeAt(i){if(fixedBiome>=0)return fixedBiome;const f=mod(i,N)/N;return f<.2?0:f<.4?1:f<.6?2:f<.8?3:4;}

  tntbig:{hw:.12,k:1.25,b:[[-7,-14,14,14,'#d33a2f'],[-7,-9,14,4,'#f0f0f0'],[-3,-13,6,2,'#111'],[-1,-17,2,3,'#5a3a1a']]},
  creeper:{hw:.09,k:1.9,b:[[-4,-26,8,8,'#4fae3a'],[-3,-24,2,2,'#101010'],[1,-24,2,2,'#101010'],[-1,-21,2,3,'#101010'],[-2,-20,1,2,'#101010'],[1,-20,1,2,'#101010'],[-3,-18,6,12,'#43a032'],[-4,-6,4,6,'#3b8c2c'],[0,-6,4,6,'#3b8c2c']]},

  // deserto

  deadbush:{hw:.06,k:1.2,b:[[-4,-5,2,5,'#8a6a3a'],[0,-8,2,8,'#7a5a2e'],[3,-4,2,4,'#8a6a3a'],[-2,-7,2,2,'#7a5a2e']]},

  sandstone:{hw:.12,k:1.0,b:[[-6,-8,12,8,'#d9c98a'],[-6,-4,12,1,'#b8a766']]},
  // neve
  snowpine:{hw:.10,k:1.9,b:[[-1.5,-6,3,6,'#6b4a2b'],[-8,-13,16,7,'#2e6a3e'],[-8,-14,16,2,'#f5f9ff'],[-6,-19,12,6,'#3a7e4a'],[-6,-20,12,2,'#f5f9ff'],[-4,-24,8,5,'#46925a'],[-4,-25,8,2,'#f5f9ff'],[-2,-28,4,3,'#ffffff']]},
  snowman:{hw:.09,k:1.5,b:[[-5,-8,10,8,'#f5f9ff'],[-4,-15,8,7,'#f0f5fa'],[-3,-21,6,6,'#f5f9ff'],[-4,-9,8,1,'#c8262e'],[-2,-19,1,1,'#111'],[1,-19,1,1,'#111'],[0,-17,3,1,'#e0701a'],[-3,-23,6,2,'#222']]},
  ice:{hw:.12,k:1.1,b:[[-6,-8,12,8,'#9fd8f0'],[-4,-6,4,3,'#d9f1fb'],[2,-3,3,2,'#d9f1fb']]},
  igloo:{hw:.2,k:1.8,b:[[-10,-6,20,6,'#eef6fb'],[-7,-11,14,5,'#f7fbfe'],[-4,-14,8,3,'#ffffff'],[-3,-5,6,5,'#2a3a4a']]},
  // nether
  lavapillar:{hw:.10,k:1.5,b:[[-4,-22,8,22,'#7a1c14'],[-4,-23,8,1,'#a82a1a'],[-2,-18,4,4,'#ff7a10',1],[-2,-10,4,4,'#ff7a10',1]]},
  glowstone:{hw:.10,k:1.1,b:[[-5,-8,10,8,'#d9a82a',1],[-2,-13,5,5,'#f5d060',1]]},
  fire:{hw:.08,k:1.2,b:[[-5,-6,10,6,'#e8520a',1],[-3,-11,6,6,'#ff9a1a',1],[-1,-15,3,4,'#ffe066',1]]},
  fungus:{hw:.09,k:1.8,b:[[-2,-20,4,20,'#7a1f3a'],[-8,-26,16,7,'#b3203a'],[-5,-31,10,5,'#c92a46'],[-6,-26,2,2,'#f5d060',1]]},
  basalt:{hw:.08,k:1.5,b:[[-3,-16,6,16,'#3a3a40'],[-3,-10,6,2,'#2a2a30'],[-3,-4,6,2,'#2a2a30']]},
  portal:{hw:.16,k:2.2,b:[[-12,-44,24,4,'#1a0f2e'],[-12,-40,4,40,'#1a0f2e'],[8,-40,4,40,'#1a0f2e'],[-8,-40,16,40,'#8a2be2',1],[-6,-30,3,6,'#c07bff',1],[1,-18,4,5,'#c07bff',1]]},
  // cogumelos
  shroomR:{hw:.10,k:1.8,b:[[-3,-16,6,16,'#efe6d0'],[-10,-24,20,8,'#c8262e'],[-8,-28,16,5,'#d63a40'],[-7,-23,3,3,'#ffffff'],[3,-22,3,3,'#ffffff'],[-2,-27,3,2,'#ffffff']]},

  shroomS:{hw:.06,k:1.0,b:[[-1,-5,2,5,'#efe6d0'],[-4,-9,8,4,'#c8262e'],[-2,-8,2,2,'#ffffff']]},
  glowshroom:{hw:.07,k:1.2,b:[[-1,-6,2,6,'#d8c8f0'],[-5,-11,10,5,'#8a4ad6',1],[-3,-9,2,2,'#e8c8ff',1]]}
};
SPR.snowpine2={hw:.10,k:2.6,b:SPR.snowpine.b};
{
  const stand=[[-14,-5,28,5,'#5a5a62'],[-14,-10,28,5,'#6a6a72'],[-14,-15,28,5,'#7a7a82']];
  const cols=['#e53935','#2457d6','#f5d031','#2fa84a','#ffffff','#ee7f1a'];
  for(let t=0;t<3;t++)for(let i=0;i<7;i++)stand.push([-13+i*4,-8-t*5,2,3,cols[(i*3+t*2)%6]]);
  SPR.stand={hw:.35,k:1.6,b:stand};
}
const SCENE=[
  [['tree',.30],['tall',.14],['bush',.06],['hay',.04],['pumpkin',.02],['stone',.03],['house',.04],['flowerR',.10],['flowerY',.10],['flowerB',.07]],
  [['cactus',.35],['deadbush',.20],['palm',.15],['sandstone',.15],['pyramid',.03],['stone',.05]],
  [['snowpine',.35],['snowpine2',.20],['ice',.15],['snowman',.06],['igloo',.03],['stone',.05]],
  [['lavapillar',.20],['glowstone',.18],['fire',.22],['fungus',.25],['basalt',.15],['portal',.02]],
  [['shroomR',.25],['shroomB',.20],['shroomS',.25],['glowshroom',.20],['bush',.05]]
];
function pickType(b,R){
  const t=SCENE[b];let tot=0;for(const e of t)tot+=e[1];
  let r=R()*tot;for(const e of t){r-=e[1];if(r<=0)return e[0];}
  return t[0][0];
}
function buildScenery(bf){
  fixedBiome=bf;
  const R=rng(4242+(bf+2)*31);
  for(const sg of segs){
    sg.sprites.length=0;sg.arch=undefined;
    sg.biome=biomeAt(sg.index);
    sg.c.grass=BIOMES[sg.biome].g[Math.floor(sg.index/rumbleLen)%2?1:0];
  }
  if(bf<0)for(let b=1;b<5;b++)segs[Math.ceil(N*.2*b)].arch=b;
  for(let n=8;n<N;n+=4){
    const b=segs[n].biome;
    for(let side=-1;side<=1;side+=2){
      if(R()<.6)segs[n].sprites.push({type:pickType(b,R),offset:side*(1.35+R()*2.6)});
    }
  }
  for(let n=40;n<N;n+=45){
    const side=R()<.5?-1:1,b=segs[n].biome;
    segs[n].sprites.push({type:R()<.4?'tnt':pickType(b,R),offset:side*(1.2+R()*.1)});
  }
  for(let n=6;n<N;n+=10){
    if(segs[n].biome===3)continue;
    segs[n].sprites.push({type:'lamp',offset:-1.3},{type:'lamp',offset:1.3});
  }
  for(let n=1;n<=13;n+=3)segs[n].sprites.push({type:'stand',offset:-2.35},{type:'stand',offset:2.35});
}

// ---------- obstaculos na pista
const obstacles=[];
function addObs(n,o){o.seg=n%N;o.alive=true;o.z=(n%N)*segLen+segLen/2;o.cool=0;segs[n%N].obs.push(o);obstacles.push(o);return o;}
const DIFFS=[
  {n:'FÁCIL',col:'#7dff5a',desc:'LARGADA NA FRENTE, QUASE SEM OBSTÁCULOS',gap:[260,160],kinds:['lava','web','tnt'],look:10,cs:.5,gapN:2,miss:.75,ahead:0,behind:3},
  {n:'NORMAL',col:'#ffe066',desc:'LARGADA NO MEIO DO GRID',gap:[70,60],kinds:['tnt','wall','lava','web','creeper','iron','creeper','wall'],look:26,cs:1,gapN:2,miss:.25,ahead:4,behind:4},
  {n:'DIFÍCIL',col:'#ff9a1a',desc:'LARGADA ATRÁS, IA ATENTA, MAIS OBSTÁCULOS',gap:[45,35],kinds:['tnt','wall','lava','web','creeper','iron','creeper','wall','creeper'],look:34,cs:1.3,gapN:2,miss:.08,ahead:7,behind:2},

];
DIFFS.forEach((d,i)=>{d.seed=i;d.laps=i===0?2:3;d.biome=-1;});
const K1=['tnt','wall','lava','web','creeper','iron','creeper','wall'];
const K2=['tnt','wall','lava','web','creeper','iron','creeper','wall','creeper'];
const K3=['wall','wall','creeper','creeper','iron','tnt','lava','web'];
const LEVELS=[
  {n:'PLANÍCIE VERDE',short:'PLANICIE',biome:0,laps:2,gap:[170,110],kinds:['lava','web','tnt'],look:12,cs:.5,gapN:2,miss:.7,ahead:0,behind:4},
  {n:'DUNAS QUENTES',short:'DUNAS',biome:1,laps:2,gap:[130,90],kinds:['lava','web','tnt','iron'],look:16,cs:.7,gapN:2,miss:.5,ahead:1,behind:5},

function buildObstacles(D){
  const R=rng(900+D.seed*17);
  for(const sg of segs)sg.obs.length=0;
  obstacles.length=0;
  let n=120;
  while(n<N-60){
    const k=D.kinds[Math.floor(R()*D.kinds.length)];
    if(k==='tnt'){
      addObs(n,{type:'tntbig',offset:(R()-.5)*1.3,hw:.12});
      addObs(n+7,{type:'tntbig',offset:(R()-.5)*1.3,hw:.12});
    }else if(k==='wall'){
      const gap=Math.floor(R()*(7-D.gapN-1));
      for(let i=0;i<6;i++){
        if(i>=gap&&i<gap+D.gapN)continue;
        addObs(n,{type:'tntbig',offset:-.75+i*.3,hw:.12,gapC:-.75+(gap+(D.gapN-1)/2)*.3});
      }
    }else if(k==='lava'||k==='web'){
      const off=(R()-.5)*1.1;
      for(let j=0;j<3;j++)addObs(n+j,{type:k,flat:true,offset:off,hw:.34});
    }else if(k==='creeper'){
      addObs(n,{type:'creeper',hw:.09,amp:.85,sp:(.8+R()*.6)*D.cs,ph:R()*6.28,move:true,offset:0});
    }else{
      addObs(n,{type:'iron',hw:.14,amp:.8,sp:(1.4+R()*.8)*D.cs,ph:R()*6.28,move:true,offset:0});
    }
    n+=D.gap[0]+Math.floor(R()*D.gap[1]);
  }
}

function mpPush(){

function mpBegin(dif){

  const me=mpPeers().find(p=>p.isMe);
  let slot=me?ps.indexOf(me.peer):0;if(slot<0)slot=0;
  mpDiff=dif;mode='mp';startRace();

  const host=mpHost(),hp=host&&host.presence;

function mpRemoveCar(car){
  const sg=segAt(car.z),i=sg.cars.indexOf(car);if(i>=0)sg.cars.splice(i,1);
  const j=cars.indexOf(car);if(j>=0)cars.splice(j,1);
}
function updateRemote(dt){
  if(!mp.room)return;
  const now=Date.now(),seen=new Set();
  for(const p of mpPeers()){
    if(p.isMe)continue;const pr=p.presence;
    if(!pr||(pr.st!=='cd'&&pr.st!=='race'&&pr.st!=='fin'))continue;
    seen.add(p.peer);
    const tm=TEAMS[(pr.t|0)%TEAMS.length]||TEAMS[0];
    let car=mp.cars.get(p.peer);
    if(!car){
      car={dist:+pr.d||-1500,offset:+pr.x||0,speed:0,vmax:maxSpeed,c:tm.c,d:tm.d,seen:new Set(),ign:new Set(),peer:p.peer,by:p.by,boomT:0};
      car.z=mod(car.dist,trackLen);segAt(car.z).cars.push(car);cars.push(car);mp.cars.set(p.peer,car);
    }
    car.c=tm.c;car.d=tm.d;car.by=p.by;car.f=pr.f>0?pr.f:null;
    const sp=clamp(+pr.s||0,0,maxSpeed),age=Math.min(.5,(now-p.updatedAt)/1000),k=Math.min(1,dt*10);
    const old=segAt(car.z);
    car.dist+=((+pr.d||0)+sp*age-car.dist)*k;
    car.offset+=((+pr.x||0)-car.offset)*k;
    car.speed=sp;car.z=mod(car.dist,trackLen);
    const nw=segAt(car.z);
    if(nw!==old){const i=old.cars.indexOf(car);if(i>=0)old.cars.splice(i,1);nw.cars.push(car);}
  }
  for(const [id,car] of mp.cars)if(!seen.has(id)){mpRemoveCar(car);mp.cars.delete(id);}
}
function uc(dt,m){if(mode==='mp'&&m!=='attract')updateRemote(dt);else updateCars(dt,m);}
function standings(){
  const L=[{me:true,name:cloud.name||'VOCÊ',f:state==='finish'?finishTime:null,dist:trackDist,c:TEAMS[team].c}];
  for(const c of cars)if(c.peer)L.push({me:false,name:mpName(c.by),f:c.f>0?c.f:null,dist:c.dist,c:c.c});
  L.sort((a,b)=>{const fa=a.f!=null,fb=b.f!=null;if(fa!==fb)return fa?-1:1;if(fa)return a.f-b.f;return b.dist-a.dist;});

function mpActivate(){

function mpKey(e){

    if(e.code==='ArrowUp'||e.code==='KeyW')mp.sel=mod(mp.sel-1,3);
    if(e.code==='ArrowDown'||e.code==='KeyS')mp.sel=mod(mp.sel+1,3);
    if(e.code==='Enter'||e.code==='Space')mpActivate();
  }else if(mp.sub==='code'){
    if(e.code==='Enter')mpJoin(mp.codeIn);
    else if(e.code==='Backspace')mp.codeIn=mp.codeIn.slice(0,-1);
    else if(e.key&&e.key.length===1&&/[a-zA-Z0-9]/.test(e.key)&&mp.codeIn.length<6)mp.codeIn+=e.key.toUpperCase();
  }else if(mp.sub==='lobby'){
    if(e.code==='ArrowLeft'||e.code==='KeyA')team=mod(team-1,teamAvail());
    if(e.code==='ArrowRight'||e.code==='KeyD')team=mod(team+1,teamAvail());

      if(e.code==='ArrowDown'||e.code==='KeyS')mpDiff=mod(mpDiff-1,4);

  }
  if(e.code==='Escape')mpEsc();

function cloudPayload(){return {u:camp.u,b:camp.b.slice(),d:diff,best:localBests()};}
function cloudMerge(r){
  if(!r||typeof r!=='object')return;
  if(r.u>=1)camp.u=Math.max(camp.u,Math.min(LEVELS.length,r.u|0));
  if(Array.isArray(r.b))for(let i=0;i<LEVELS.length;i++){
    const a=camp.b[i]|0,b=r.b[i]|0;
    camp.b[i]=a&&b?Math.min(a,b):(a||b);
  }
  if(r.best&&typeof r.best==='object'){
    try{for(const k in r.best){
      if(!/^[dc]\d$/.test(k))continue;const v=+r.best[k];if(!(v>0))continue;
      const key='f1cube_best_'+(k[0]==='d'?k[1]:'c'+k[1]);
      const cur=parseFloat(localStorage.getItem(key));
      if(!(cur>0)||v<cur)localStorage.setItem(key,String(v));
    }}catch(e){}
  }
  if(typeof r.d==='number'&&r.d>=0&&r.d<4&&!cloud.touchedDiff){diff=r.d|0;}
  saveCamp();
}
async function cloudSave(){

let ac=null,osc=null,gain=null,muted=false;
function audioInit(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    osc=ac.createOscillator();osc.type='sawtooth';
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;
    gain=ac.createGain();gain.gain.value=0;
    osc.connect(lp);lp.connect(gain);gain.connect(ac.destination);osc.start();
  }catch(e){ac=null;}
}
function beep(f,d,type){
  if(!ac||muted)return;
  try{
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function audioTick(){
  if(!ac)return;
  const t=ac.currentTime;
  const f=55+(speed/maxSpeed)*230+(isU()&&state==='race'?12:0);
  const g=muted?0:state==='race'||state==='finish'?.05:(state==='title'||state==='levels'||state==='rules'||state==='login'||state==='mp')?.015:.025;
  osc.frequency.setTargetAtTime(f,t,.06);

// ---------- carros da IA
function makeCars(){
  for(const s of segs)s.cars.length=0;
  cars=[];
  mp.cars=new Map();
  if(mode==='mp')return;
  const D=CFG,total=D.ahead+D.behind;
  const pool=TEAMS.map((t,i)=>i).filter(i=>i!==team);
  for(let i=0;i<total;i++){
    const slot=i<D.behind?-(i+1):(i-D.behind+1);
    const t=TEAMS[pool[i%pool.length]];
    const car={dist:-1500+220*slot,offset:[-.75,-.25,.25,.75][i%4]+(rand()-.5)*.1,speed:0,vmax:maxSpeed,c:t.c,d:t.d,seen:new Set(),ign:new Set()};
    car.z=mod(car.dist,trackLen);car.lane=car.offset;
    segAt(car.z).cars.push(car);
    cars.push(car);
  }
}
function obsAvoid(car,cs){
  for(let i=1;i<CFG.look;i++){
    const s=segs[(cs.index+i)%N];
    for(const o of s.obs){
      if(!o.alive||car.ign.has(o))continue;
      if(!car.seen.has(o)){car.seen.add(o);if(Math.random()<CFG.miss){car.ign.add(o);continue;}}
      if(o.gapC!==undefined){const d=o.gapC-car.offset;return Math.abs(d)>.05?Math.sign(d)*.03:0;}
      if(!overlap(car.offset,.3,o.offset,o.hw*2,1.6))continue;
      const need=o.hw+.2,okR=o.offset+need<=.88,okL=o.offset-need>=-.88;
      if(okR&&okL)return (car.offset>=o.offset?1:-1)*.03;
      if(okR)return .03;
      if(okL)return -.03;
      return 0;
    }
  }
  return null;
}
function carObs(car,seg,dt){
  for(let i=0;i<2;i++){
    const s=segs[(seg.index+i)%N];
    for(const o of s.obs){
      if(!o.alive)continue;
      if(!overlap(car.offset,.3,o.offset,o.hw*2,1))continue;
      if(o.flat){
        if(i===0){
          if(o.type==='lava')car.speed=Math.max(0,car.speed-maxSpeed*1.1*dt);
          else if(car.speed>maxSpeed*.35)car.speed-=maxSpeed*1.5*dt;
        }
      }else if(o.type==='tntbig'||o.type==='creeper'){
        o.alive=false;car.speed=Math.min(car.speed,maxSpeed*.2);car.stun=.8;car.boomT=.7;
        car.offset+=(Math.random()-.5)*.3;
      }else{
        car.speed=Math.min(car.speed,maxSpeed*.15);
        car.offset+=(car.offset>o.offset?1:-1)*.05;car.dist-=mod(car.z,segLen)*.5;
      }
    }
  }
}
function carAvoid(car,cs,ps){
  const ob=obsAvoid(car,cs);
  if(ob!==null)return ob;
  const look=20,cw=.35;
  for(let i=1;i<look;i++){
    const s=segs[(cs.index+i)%N];
    if(s===ps&&car.speed>speed&&overlap(car.offset,cw,playerX,cw,1.2)){
      let dir=playerX>.5?-1:playerX<-.5?1:(car.offset>playerX?1:-1);
      return dir/i*(car.speed-speed)/maxSpeed;
    }
    for(const o of s.cars){
      if(car.speed>o.speed&&overlap(car.offset,cw,o.offset,cw,1.2)){
        let dir=o.offset>.5?-1:o.offset<-.5?1:(car.offset>o.offset?1:-1);
        return dir/i*(car.speed-o.speed)/maxSpeed;
      }
    }
  }
  return (car.lane-car.offset)*.15;
}
function carSprites(car,seg){
  if(Math.abs(car.offset)<=.9)return;
  for(let i=0;i<2;i++){
    const s=segs[(seg.index+i)%N];
    for(const sp of s.sprites){
      if(overlap(car.offset,.3,sp.offset,SPR[sp.type].hw*2,1)){
        car.speed=Math.min(car.speed,maxSpeed/5);car.dist-=mod(car.z,segLen);
      }
    }
  }
}
function carBump(car,seg){
  const pseg=segAt(trackDist);
  for(let i=0;i<2;i++){
    const s=segs[(seg.index+i)%N];
    for(const o of s.cars){
      if(o===car)continue;
      if(car.speed>o.speed&&overlap(car.offset,.35,o.offset,.35,.8)){
        const rel=mod(o.z-car.z+trackLen/2,trackLen)-trackLen/2;
        if(rel>-100&&rel<500){car.speed=o.speed*(o.speed/Math.max(1,car.speed));car.dist+=rel-300;}
      }
    }
    if(s===pseg&&car.speed>speed&&overlap(car.offset,.35,playerX,.35,.8)){
      const rel=mod(trackDist-car.z+trackLen/2,trackLen)-trackLen/2;
      if(rel>-100&&rel<500){car.speed=speed*(speed/Math.max(1,car.speed));car.dist+=rel-300;}
    }
  }
}
function updateCars(dt,mode){
  const ps=segAt(trackDist);
  for(const car of cars){
    if(mode==='wait')car.speed=0;
    else if(mode==='attract')car.speed=car.vmax;
    else car.speed=Math.min(car.vmax,car.speed+accel*dt);
    car.stun=Math.max(0,(car.stun||0)-dt);car.boomT=Math.max(0,(car.boomT||0)-dt);
    const old=segAt(car.z);
    if(mode==='race'){
      const spct=car.speed/maxSpeed,lim=dt*2*spct*(car.stun>0?.4:1);
      const st=car.speed>0?clamp(carAvoid(car,old,ps),-lim,lim):0;
      car.offset+=st-lim*spct*old.curve*centrifugal;
      if(Math.abs(car.offset)>1&&car.speed>offLimit)car.speed+=offDecel*dt;
    }else if(car.speed>0){
      car.offset=clamp(car.offset+carAvoid(car,old,ps),-.85,.85);
    }
    car.dist+=dt*car.speed;car.z=mod(car.dist,trackLen);
    const nw=segAt(car.z);
    if(mode==='race'){
      carObs(car,nw,dt);carSprites(car,nw);carBump(car,nw);
      car.offset=clamp(car.offset,-2.2,2.2);
      car.speed=clamp(car.speed,0,maxSpeed);
    }
    if(nw!==old){old.cars.splice(old.cars.indexOf(car),1);nw.cars.push(car);}
  }
}

  playerX+=(rand()-.5)*.3;beep(70,.5,'sawtooth');beep(45,.7,'square');say('BOOM!','#ffb020');

function hitObs(o){
  if(o.type==='tntbig'||o.type==='creeper'){boom(o);return;}
  speed=Math.min(speed,maxSpeed*.15);shake=Math.max(shake,.3);
  playerX+=(playerX>o.offset?1:-1)*.05;trackDist-=mod(trackDist,segLen)*.5;

function updateObs(){

function rank(){let r=1;for(const c of cars)if(c.dist>trackDist)r++;return r;}
function crossLine(n){
  if(n===0){lapStart=raceTime;return;}
  const lt=raceTime-lapStart;lapTimes.push(lt);lapStart=raceTime;
  if(lt<bestLap){bestLap=lt;try{localStorage.setItem(bestKey(),String(lt));}catch(e){}cloudSave();}
  beep(880,.15);respawnObs();
  if(n>=CFG.laps)finishRace();
}
function updateBg(spct,curve){
  bg1-=curve*spct*.3;bg2-=curve*spct*.6;bg3-=curve*spct*.9;
}
function update(dt){
  clock+=dt;
  if(state==='mp')mpTick();else if(mode==='mp'&&(++mp.n)%3===0)mpPush();
  shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);stun=Math.max(0,stun-dt);msgT=Math.max(0,msgT-dt);biomeT=Math.max(0,biomeT-dt);
  if(state==='race'){const pb=segAt(trackDist).biome;if(pb!==lastBiome){lastBiome=pb;biomeCur=pb;biomeT=2.8;}}
  updateObs();
  const ps=segAt(trackDist),spct=speed/maxSpeed;
  updateBg(spct,ps.curve);
  if(state==='title'||state==='levels'||state==='rules'||state==='login'||state==='mp'){
    speed=maxSpeed*.5;trackDist+=dt*speed;playerX=Math.sin(clock*.8)*.5;steer=Math.cos(clock*.8)>0?1:-1;braking=false;
    updateCars(dt,'attract');return;
  }
  if(state==='countdown'){
    cd-=dt;const n=Math.ceil(cd);
    if(n<lastCd&&n>0){beep(440,.2);lastCd=n;}
    if(cd<=0){state='race';goTimer=1.2;beep(880,.5);}
    uc(dt,'wait');return;
  }
  if(state==='finish'){
    speed=Math.max(0,speed-maxSpeed*.3*dt);playerX*=.985;steer=0;braking=true;
    trackDist+=dt*speed;uc(dt,'race');return;
  }
  // corrida
  raceTime+=dt;if(goTimer>0)goTimer-=dt;
  const dx=dt*2*spct*(stun>0?.4:1),prev=trackDist;
  trackDist+=dt*speed;
  const a=Math.floor(prev/trackLen),b=Math.floor(trackDist/trackLen);
  if(b>a)crossLine(b);
  if(state!=='race'){uc(dt,'race');return;}
  steer=0;
  if(isL()){playerX-=dx;steer=-1;}else if(isR()){playerX+=dx;steer=1;}
  playerX-=dx*spct*ps.curve*centrifugal;
  braking=!!isD();
  if(isU())speed+=accel*dt;else if(braking)speed+=brk*dt;else speed+=decel*dt;
  if((playerX<-1||playerX>1)&&speed>offLimit)speed+=offDecel*dt;
  if(Math.abs(playerX)>.9){
    for(let i=0;i<2;i++){
      const s=segs[(ps.index+i)%N];
      for(const sp of s.sprites){
        const hw=SPR[sp.type].hw;
        if(overlap(playerX,.3,sp.offset,hw*2,1)){
          speed=Math.min(speed,maxSpeed/5);trackDist-=mod(trackDist,segLen);beep(120,.2,'sawtooth');
        }
      }
    }
  }
  for(let i=0;i<2;i++){
    const s=segs[(ps.index+i)%N];
    for(const car of s.cars){
      if(speed>car.speed&&overlap(playerX,.35,car.offset,.35,.8)){
        const rel=mod(car.z-mod(trackDist,trackLen)+trackLen/2,trackLen)-trackLen/2;
        if(rel>-100&&rel<500){
          speed=car.speed*(car.speed/Math.max(1,speed));
          trackDist+=rel-300;beep(160,.15,'sawtooth');
        }
      }
    }
  }
  for(let i=0;i<2;i++){
    const s=segs[(ps.index+i)%N];
    for(const o of s.obs){
      if(!o.alive)continue;
      if(o.flat){if(i===0&&overlap(playerX,.3,o.offset,o.hw*2,1))onFlat(o,dt);continue;}
      if(overlap(playerX,.3,o.offset,o.hw*2,1))hitObs(o);
    }
  }
  playerX=clamp(playerX,-2.2,2.2);
  speed=clamp(speed,0,maxSpeed);
  uc(dt,'race');
}

const shCache={};
function shade(hex,f){
  const k=hex+f;if(shCache[k])return shCache[k];
  const n=parseInt(hex.slice(1),16);
  const r=clamp(Math.round((n>>16)*f),0,255),g=clamp(Math.round(((n>>8)&255)*f),0,255),b=clamp(Math.round((n&255)*f),0,255);
  return shCache[k]='rgb('+r+','+g+','+b+')';
}
function rect(cx,cy,x,y,w,h,s,col){
  const x0=Math.round(cx+x*s),x1=Math.round(cx+(x+w)*s),y0=Math.round(cy+y*s),y1=Math.round(cy+(y+h)*s);
  const ww=Math.max(1,x1-x0),hh=Math.max(1,y1-y0);
  ctx.fillStyle=col;ctx.fillRect(x0,y0,ww,hh);
  return [x0,y0,ww,hh];
}
function box(cx,cy,x,y,w,h,s,col){
  const r=rect(cx,cy,x,y,w,h,s,col);
  if(r[2]>=4&&r[3]>=4){
    ctx.fillStyle=shade(col,1.28);ctx.fillRect(r[0],r[1],r[2],1);
    ctx.fillStyle=shade(col,.7);ctx.fillRect(r[0],r[1]+r[3]-1,r[2],1);ctx.fillRect(r[0]+r[2]-1,r[1],1,r[3]);
  }
}
function drawCar(cx,cy,s,col,dk,brake){
  rect(cx,cy,-16,-1.5,32,3,s,'rgba(0,0,0,.35)');
  box(cx,cy,-15,-13,7,13,s,'#202024');
  box(cx,cy,8,-13,7,13,s,'#202024');
  box(cx,cy,-9,-6,18,4,s,'#2b2b30');
  box(cx,cy,-7,-14,14,9,s,col);
  box(cx,cy,-4,-18,8,6,s,dk);
  box(cx,cy,-3,-24,6,5,s,'#f5d031');
  rect(cx,cy,-2,-22,4,2,s,'#111');

function lite(h,f){
  const n=parseInt(h.slice(1),16);
  const r=clamp(Math.round((n>>16)*f+40),0,255),g=clamp(Math.round(((n>>8)&255)*f+40),0,255),b=clamp(Math.round((n&255)*f+40),0,255);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function drawSprite(sp,cx,cy,sc){
  const d=SPR[sp.type],s=WPU*sc*W/2*d.k;
  for(const b of d.b){
    let col=sp.flash?lite(b[4],1.9):b[4];
    if(b[5]&&Math.floor(clock*5+(sp.offset||0)*7)%2)col=lite(col,1.35);
    box(cx,cy,b[0],b[1],b[2],b[3],s,col);
  }
}
function strip(y1,x1,w1,y2,x2,w2,col){
  const h=y1-y2;if(h<=0)return;
  ctx.fillStyle=col;
  for(let y=Math.max(0,y2);y<Math.min(H,y1);y++){
    const t=(y-y2+.5)/h,xc=x2+(x1-x2)*t,w=w2+(w1-w2)*t;
    const l=Math.round(xc-w),r=Math.round(xc+w);
    ctx.fillRect(l,y,r-l,1);
  }
}
function drawSeg(s){
  const a=s.p1.screen,b=s.p2.screen,y1=a.y,y2=b.y;
  ctx.fillStyle=s.c.grass;ctx.fillRect(0,y2,W,y1-y2);
  const r1=a.w/6,r2=b.w/6;
  strip(y1,a.x,a.w+r1,y2,b.x,b.w+r2,s.c.rumble);
  strip(y1,a.x,a.w,y2,b.x,b.w,s.c.road);
  if(s.c.lane){
    const l1=a.w/Math.max(32,8*lanes),l2=b.w/Math.max(32,8*lanes);
    const lw1=a.w*2/lanes,lw2=b.w*2/lanes;
    let lx1=a.x-a.w+lw1,lx2=b.x-b.w+lw2;
    for(let i=1;i<lanes;i++,lx1+=lw1,lx2+=lw2)strip(y1,lx1,l1,y2,lx2,l2,s.c.lane);
  }
  for(const o of s.obs){
    if(!o.flat||!o.alive)continue;
    const lava=o.type==='lava';
    const c1=lava?'#d9430a':'#cfcfcf',c2=lava?(Math.floor(clock*3)%2?'#ffb020':'#ff7a10'):'#f6f6f6';
    strip(y1,a.x+a.w*o.offset,a.w*o.hw,y2,b.x+b.w*o.offset,b.w*o.hw,c1);
    strip(y1,a.x+a.w*o.offset,a.w*o.hw*.55,y2,b.x+b.w*o.offset,b.w*o.hw*.55,c2);
  }
  if(s.fog>0){ctx.globalAlpha=s.fog;ctx.fillStyle=FOG;ctx.fillRect(0,y2,W,y1-y2);ctx.globalAlpha=1;}
}
function proj(p,camX,camY,camZ){
  p.camera.x=(p.world.x||0)-camX;
  p.camera.y=(p.world.y||0)-camY;
  p.camera.z=p.world.z-camZ;
  const sc=camDepth/p.camera.z;
  p.screen.scale=sc;
  p.screen.x=Math.round(W/2+sc*p.camera.x*W/2);
  p.screen.y=Math.round(HZ-sc*p.camera.y*H/2);
  p.screen.w=Math.round(sc*roadW*W/2);
}

function lerpArr(a,b,k){for(let i=0;i<a.length;i++){if(typeof a[i]==='number')a[i]+=(b[i]-a[i])*k;else lerpArr(a[i],b[i],k);}}
function drawBG(tb){
  const t=PAL[tb];
  for(const key in curPal)lerpArr(curPal[key],t[key],.05);
  const P=curPal;
  FOG=rgb(P.sky[4]);GROUND=rgb(P.ground);
  const bh=HZ/5;
  for(let i=0;i<5;i++){ctx.fillStyle=rgb(P.sky[i]);ctx.fillRect(0,Math.floor(i*bh),W,Math.ceil(bh)+1);}
  ctx.fillStyle=GROUND;ctx.fillRect(0,HZ,W,H-HZ);
  const sx=Math.round(mod(250+bg1*.2,W+40)-20);
  ctx.fillStyle=rgb(P.sunB);ctx.fillRect(sx-2,10,26,26);
  ctx.fillStyle=rgb(P.sun);ctx.fillRect(sx,12,22,22);
  const cA=rgb(P.cloudA),cB=rgb(P.cloudB);
  for(const c of CLOUDS){
    const x=Math.round(mod(c[0]+bg1+clock*2,W+80)-40),y=c[1];
    ctx.fillStyle=cB;ctx.fillRect(x,y+4,34,5);
    ctx.fillStyle=cA;ctx.fillRect(x+2,y,26,5);ctx.fillRect(x+8,y-4,14,5);ctx.fillRect(x+22,y+2,14,4);
  }
  const o2=Math.round(bg2),o3=Math.round(bg3);
  const far=rgb(P.far),farTop=rgb(P.farTop),peak=rgb(P.peak),near=rgb(P.near),nearTop=rgb(P.nearTop);
  for(let sx2=0;sx2<W;sx2+=4){
    const h=mh1[Math.floor(mod(sx2-o2,MP)/4)];
    ctx.fillStyle=far;ctx.fillRect(sx2,HZ-h,4,h+1);
    ctx.fillStyle=h>=34?peak:farTop;ctx.fillRect(sx2,HZ-h,4,4);
  }
  for(let sx2=0;sx2<W;sx2+=4){
    const h=mh2[Math.floor(mod(sx2-o3,MP)/4)];
    ctx.fillStyle=near;ctx.fillRect(sx2,HZ-h,4,h+1);
    ctx.fillStyle=nearTop;ctx.fillRect(sx2,HZ-h,4,3);
  }
}
const PARTS=[];
for(let i=0;i<70;i++)PARTS.push({x:rand()*W,y:rand()*H,v:rand(),ph:rand()*6.28});
function drawParts(b){
  if(b<2)return;
  for(const p of PARTS){
    if(b===2){p.y+=.35+p.v*.5;p.x+=Math.sin(clock*1.5+p.ph)*.25-.15;ctx.fillStyle=p.v>.5?'#ffffff':'#dfe9f4';}
    else if(b===3){p.y-=.3+p.v*.5;p.x+=Math.sin(clock*2+p.ph)*.3;ctx.fillStyle=Math.floor(clock*6+p.ph*3)%2?'#ff9a1a':'#ffd04a';}
    else{p.y-=.12+p.v*.15;p.x+=Math.sin(clock+p.ph)*.2;ctx.fillStyle=p.v>.5?'#d8a8ff':'#ffb0e0';}
    if(p.y>H)p.y=-2;if(p.y<-2)p.y=H;if(p.x<-2)p.x=W;if(p.x>W)p.x=-2;
    const z=p.v>.7?2:1;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),z,z);
  }
}

// ---------- render
function render(){
  const pc=mod(trackDist-playerZ,trackLen);
  const base=segs[Math.floor(pc/segLen)],basePct=(pc%segLen)/segLen;
  const ps=segAt(trackDist),pPct=(mod(trackDist,trackLen)%segLen)/segLen;
  const pY=lerp(ps.p1.world.y,ps.p2.world.y,pPct);
  ctx.save();
  if(shake>0){const m=Math.min(1,shake)*4;ctx.translate(Math.round((Math.random()-.5)*m),Math.round((Math.random()-.5)*m));}
  drawBG(biomeAt(base.index+40));
  let maxy=H,x=0,dx=-(base.curve*basePct);
  for(let n=0;n<drawDist;n++){
    const s=segs[(base.index+n)%N];
    s.looped=s.index<base.index;
    s.fog=1-Math.exp(-fogDensity*Math.pow(n/drawDist,2));
    s.clip=maxy;
    const camZ=pc-(s.looped?trackLen:0);
    proj(s.p1,playerX*roadW-x,pY+camH,camZ);
    proj(s.p2,playerX*roadW-x-dx,pY+camH,camZ);
    x+=dx;dx+=s.curve;
    if(s.p1.camera.z<=camDepth||s.p2.screen.y>=s.p1.screen.y||s.p2.screen.y>=maxy)continue;
    drawSeg(s);
    maxy=s.p1.screen.y;
  }
  for(let n=drawDist-1;n>0;n--){
    const s=segs[(base.index+n)%N],a=s.p1.screen,b=s.p2.screen;
    if(s.p1.camera.z<=camDepth)continue;
    const alpha=1-s.fog*.85;
    const clipped=(fn,cy)=>{
      ctx.globalAlpha=alpha;
      if(cy>s.clip){ctx.save();ctx.beginPath();ctx.rect(0,0,W,Math.max(0,s.clip));ctx.clip();fn();ctx.restore();}
      else fn();
      ctx.globalAlpha=1;
    };
    for(const sp of s.sprites){
      const cx=a.x+a.scale*sp.offset*roadW*W/2,cy=a.y;
      if(cx<-60||cx>W+60)continue;
      clipped(()=>drawSprite(sp,cx,cy,a.scale),cy);
    }
    for(const o of s.obs){
      if(!o.alive||o.flat)continue;
      const cx=a.x+a.scale*o.offset*roadW*W/2,cy=a.y;
      if(cx<-60||cx>W+60)continue;
      clipped(()=>drawSprite(o,cx,cy,a.scale),cy);
    }
    for(const car of s.cars){
      const pct=(car.z%segLen)/segLen,sc=lerp(a.scale,b.scale,pct);
      const cx=lerp(a.x,b.x,pct)+sc*car.offset*roadW*W/2,cy=lerp(a.y,b.y,pct);
      clipped(()=>{
        const k=WPU*sc*W/2;
        drawCar(cx,cy,k,car.c,car.d,car.speed<maxSpeed*.3);
        if(car.boomT>0){
          box(cx,cy,-9,-34,18,16,k,Math.floor(clock*12)%2?'#ff9a1a':'#ffd04a');
          box(cx,cy,-5,-40,10,9,k,'#ffe066');
        }
      },cy);
    }
    if((s.gantry||s.arch!==undefined)&&a.y<H){
      const ar=s.arch!==undefined?ARCH[s.arch]:null;
      const half=a.w*1.18,ph=Math.round(900*a.scale*W/2),bh=Math.max(2,Math.round(180*a.scale*W/2));
      const top=a.y-ph,cells=16,cw=(half*2)/cells;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=ar?ar.p:'#8a8a8a';
      const pw=Math.max(2,Math.round(70*a.scale*W/2));
      ctx.fillRect(Math.round(a.x-half-pw/2),top,pw,ph);
      ctx.fillRect(Math.round(a.x+half-pw/2),top,pw,ph);
      for(let i=0;i<cells;i++)for(let r=0;r<2;r++){
        ctx.fillStyle=ar?((i+r)%2?ar.a:ar.b):((i+r)%2?'#111':'#f4f4f4');
        ctx.fillRect(Math.round(a.x-half+i*cw),top+r*bh,Math.ceil(cw),bh);
      }
      ctx.globalAlpha=1;
    }
  }
  // jogador
  const spct=speed/maxSpeed,off=Math.abs(playerX)>1;
  let bob=0;
  if(spct>.05)bob=Math.floor(clock*30)%2;
  if(off&&spct>.1)bob+=Math.round(Math.random()*2);
  drawCar(Math.round(W/2+steer),H-6-bob,PS,TEAMS[team].c,TEAMS[team].d,braking);
  ctx.restore();
  drawParts(ps.biome);
  if(flash>0){ctx.fillStyle='rgba(255,210,110,'+Math.min(.8,flash*2)+')';ctx.fillRect(0,0,W,H);}
  if(state==='title')overlayTitle();
  else if(state==='levels')overlayLevels();
  else if(state==='rules')overlayRules();
  else if(state==='login')overlayLogin();
  else if(state==='mp')overlayMP();
  else{
    hud();
    if(state==='race'||state==='countdown')exitBtn();
    if(state==='countdown')overlayCountdown();
    if(state==='race'&&goTimer>0)T('VAI!',W/2,44,'#7dff5a','center',28);
    if(msgT>0&&state==='race')T(msg,W/2,62,msgCol,'center',12);
    if(state==='race'&&biomeT>0){
      const bt='BIOMA: '+BNAMES[biomeCur],bw=bt.length*6;
      panel(Math.round(W/2-bw/2-5),28,bw+10,12);
      T(bt,W/2,31,BCOL[biomeCur],'center');
    }
    if(state==='finish')overlayFinish();
  }
}

let last=performance.now(),acc=0;

loadBest();useCfg(DIFFS[diff]);makeCars();
function frame(now){
  acc+=Math.min(.1,(now-last)/1000);last=now;
  while(acc>=STEP){update(STEP);acc-=STEP;}
  render();audioTick();
  requestAnimationFrame(frame);
}
if(typeof requestAnimationFrame==='function')requestAnimationFrame(frame);
window.__f1=window.__f1||{};
